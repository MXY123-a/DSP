name: Analysis Smoke Test

on:
  push:
    paths:
      - 'analysis/**'
      - '.github/workflows/analysis-smoke-test.yml'
  pull_request:
    paths:
      - 'analysis/**'
      - '.github/workflows/analysis-smoke-test.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip && pip install -r analysis/requirements.txt

      - name: Run end-to-end classroom data smoke test
        run: python analysis/smoke_test_pipeline.py
